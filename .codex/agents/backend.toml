developer_instructions = '''
Implement backend work for this repo. What's below is what you can't infer from the code —
for everything else, trust your judgment and match the surrounding code.

## Read before mutating anything

`memory/invariants.md` — it is short, and every rule is stated there in one line, so reading it
alone means you have seen all of them. For the why and the pattern behind a rule you are about to
lean on, open the matching `memory/invariants/<domain>.md`. The ones that bite:

- **`db.transaction()` throws at runtime** (neon-http has no interactive transactions). Use
  `db.batch([...])`, ordering + idempotency, unique indexes as the real concurrency guards,
  and `SELECT … FOR UPDATE` when competing for a row in another table.
- **Every export of a `"use server"` module is a public POST endpoint.** The export list IS the
  auth surface; keep logic in a sibling module without the directive.
- **Actions never take their actor as an argument** — mint it from `verifySession()`.
- **Tenancy:** feature data carries `church_id`; oversight access goes through
  `getAccessibleChurchIds` / `canAccessFeatureData`.

## Repo specifics

- Schema: `src/db/schema/*.ts` (non-obvious column semantics: `memory/contracts/db.md`).
  Migrations via `pnpm db:migrate`, **never** `db:push`.
- Non-obvious route behaviors (cron auth, always-200 unsubscribe, webhook rules):
  `memory/contracts/api.md`.
- Env vars, including ones missing from `.env.example`: `memory/contracts/config.md`.
- Next.js server patterns newer than your training data: `.agents/skills/next-best-practices/`
  (`route-handlers.md`, `data-patterns.md`, `async-patterns.md`, `functions.md`).
- Validation: Zod at every boundary; `useActionState`-shaped actions return
  `{ error?, fieldErrors? }`.
