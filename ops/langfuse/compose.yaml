# Local-only Langfuse stack. Topology and dependency versions follow
# https://github.com/langfuse/langfuse/blob/v4.22.0/docker-compose.yml.
x-langfuse-environment: &langfuse-environment
  NEXTAUTH_URL: http://127.0.0.1:${LANGFUSE_WEB_HOST_PORT:?run ./ops/langfuse/manage.sh init}
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?run ./ops/langfuse/manage.sh init}@postgres:5432/postgres
  SALT: ${LANGFUSE_SALT:?run ./ops/langfuse/manage.sh init}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?run ./ops/langfuse/manage.sh init}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  LANGFUSE_IN_APP_AGENT_ENABLED: "false"
  CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
  CLICKHOUSE_URL: http://clickhouse:8123
  CLICKHOUSE_USER: clickhouse
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./ops/langfuse/manage.sh init}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run ./ops/langfuse/manage.sh init}
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
  LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
  LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: minio
  LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?run ./ops/langfuse/manage.sh init}
  LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
  LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: "true"
  LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  LANGFUSE_S3_BATCH_EXPORT_ENABLED: "false"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${REDIS_AUTH:?run ./ops/langfuse/manage.sh init}
  REDIS_TLS_ENABLED: "false"

services:
  langfuse-worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.22.0
    restart: unless-stopped
    depends_on: &langfuse-dependencies
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:${LANGFUSE_WORKER_HOST_PORT:?run ./ops/langfuse/manage.sh init}:3030"
    environment: *langfuse-environment

  langfuse-web:
    image: docker.langfuse.com/langfuse/langfuse:4.22.0
    restart: unless-stopped
    depends_on: *langfuse-dependencies
    ports:
      - "127.0.0.1:${LANGFUSE_WEB_HOST_PORT:?run ./ops/langfuse/manage.sh init}:3000"
    environment:
      <<: *langfuse-environment
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?run ./ops/langfuse/manage.sh init}
      AUTH_DISABLE_SIGNUP: "true"
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://127.0.0.1:${LANGFUSE_MINIO_API_HOST_PORT:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_ORG_ID: ${LANGFUSE_INIT_ORG_ID:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_ORG_NAME: ${LANGFUSE_INIT_ORG_NAME:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_PROJECT_ID: ${LANGFUSE_INIT_PROJECT_ID:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_PROJECT_NAME: ${LANGFUSE_INIT_PROJECT_NAME:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_INIT_PROJECT_PUBLIC_KEY:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_INIT_PROJECT_SECRET_KEY:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_INIT_USER_EMAIL:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_USER_NAME: ${LANGFUSE_INIT_USER_NAME:?run ./ops/langfuse/manage.sh init}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_INIT_USER_PASSWORD:?run ./ops/langfuse/manage.sh init}

  clickhouse:
    image: docker.io/clickhouse/clickhouse-server:25.12
    restart: unless-stopped
    user: "101:101"
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run ./ops/langfuse/manage.sh init}
    volumes:
      - langfuse_clickhouse_data:/var/lib/clickhouse
      - langfuse_clickhouse_logs:/var/log/clickhouse-server
      - ./clickhouse-logger.xml:/etc/clickhouse-server/config.d/everyfield-logger.xml:ro
    ports:
      - "127.0.0.1:${LANGFUSE_CLICKHOUSE_HTTP_HOST_PORT:?run ./ops/langfuse/manage.sh init}:8123"
      - "127.0.0.1:${LANGFUSE_CLICKHOUSE_NATIVE_HOST_PORT:?run ./ops/langfuse/manage.sh init}:9000"
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 2s

  minio:
    # Langfuse v4.22.0 intentionally uses Chainguard's rolling public image.
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" --console-address ":9001" /data'
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./ops/langfuse/manage.sh init}
    ports:
      - "127.0.0.1:${LANGFUSE_MINIO_API_HOST_PORT:?run ./ops/langfuse/manage.sh init}:9000"
      - "127.0.0.1:${LANGFUSE_MINIO_CONSOLE_HOST_PORT:?run ./ops/langfuse/manage.sh init}:9001"
    volumes:
      - langfuse_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 20
      start_period: 2s

  redis:
    image: docker.io/redis:7
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_AUTH:?run ./ops/langfuse/manage.sh init}
      - --maxmemory-policy
      - noeviction
    ports:
      - "127.0.0.1:${LANGFUSE_REDIS_HOST_PORT:?run ./ops/langfuse/manage.sh init}:6379"
    volumes:
      - langfuse_redis_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_AUTH}" ping 2>/dev/null | grep -q PONG',
        ]
      interval: 3s
      timeout: 5s
      retries: 20
    environment:
      REDIS_AUTH: ${REDIS_AUTH:?run ./ops/langfuse/manage.sh init}

  postgres:
    image: docker.io/postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run ./ops/langfuse/manage.sh init}
      POSTGRES_DB: postgres
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${LANGFUSE_POSTGRES_HOST_PORT:?run ./ops/langfuse/manage.sh init}:5432"
    volumes:
      - langfuse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  langfuse_postgres_data:
  langfuse_clickhouse_data:
  langfuse_clickhouse_logs:
  langfuse_minio_data:
  langfuse_redis_data:
