# Ticks the Plant Intelligence assessment run (#36, PE-010/AC-PE-8/NFR-PE-2).
#
# WHY THIS IS NOT A VERCEL CRON. It was one — `vercel.json` carried
# `0 7 * * *` for this route, the single daily invocation the Hobby plan
# permits. #36 cut MAX_BATCH from 25 to 10 (25 plants cannot be paced inside the
# 300s function against a 30k TPM key), which made one tick a day too few: at
# ~10-15 alpha plants the tail stayed a day stale. The fix is frequency, not a
# bigger batch — the batch size is pinned by the pacing arithmetic in
# src/app/api/phase-engine/assess/route.ts.
#
# Hobby REJECTS a sub-daily cron rather than throttling it, taking the whole
# deployment down, so a twice-daily schedule cannot live in vercel.json at all.
# Ruled 2026-08-09, following the same 2026-07-27 ruling that moved
# `/api/notifications/dispatch` here. The vercel.json entry was REMOVED in the
# same change: two schedulers for one route would double the OpenAI spend and
# race each other's TPM window.
#
# This is therefore a SCHEDULE and nothing else. It holds no logic: it makes one
# authenticated GET and reports whether the run succeeded. Everything real —
# dirty-or-stale selection, oldest-assessed-first ordering, the batch cap, TPM
# pacing, the deadline-bounded retry ladder — is in the route and
# src/lib/phase-engine/, unchanged by how the tick arrives.
#
# PUNCTUALITY. GitHub's scheduler is best-effort: it queues runs on shared
# infrastructure, commonly runs them a few minutes late, and drops them under
# heavy load. That is survivable by design — an assessment is not time-of-day
# sensitive, and anything the run does not reach stays dirty and is re-selected
# by the next tick, oldest first. A missed tick costs staleness, never data.
#
# Scheduled workflows run from the DEFAULT BRANCH only. Editing this file on a
# branch changes nothing until it merges to main. Test the shared command
# against local fixtures; never trigger production just to verify reporting.

name: Phase engine assess

on:
  schedule:
    # Twice daily. 07:00 UTC keeps the original Vercel cron's slot (early
    # morning for the US cohort, so a planter opening /phase sees a fresh read);
    # 19:00 UTC is the second pass, twelve hours apart so each run meets a fully
    # refilled TPM window and a day's material events are never more than half a
    # day from being assessed.
    - cron: "0 7 * * *"
    - cron: "0 19 * * *"
  # Manual tick, for verifying the wiring and after an outage.
  workflow_dispatch:

# Read the shared response-checking command; no repository writes are needed.
permissions:
  contents: read

concurrency:
  group: phase-engine-assess
  # Two overlapping runs would share one OpenAI key and drain each other's TPM
  # window — the exact failure #36 exists to stop. Ticks are 12 hours apart and
  # the route's own budget (RUN_BUDGET_MS=270s) sits under its 300s function
  # timeout, so an overlap means the previous tick is stuck, not busy. Let the
  # newer one win; abandoning the older curl is safe because the run persists
  # each plant as it goes and anything unreached simply stays dirty.
  cancel-in-progress: true

jobs:
  assess:
    runs-on: ubuntu-latest
    # The route bounds itself at 270s and the platform kills it at 300s. Ten
    # minutes is generous against a cold start and still bounded.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tick the assessment run
        env:
          # The stable production alias, not a per-deployment URL: those change
          # on every deploy. everyfield.app resolves to the same deployment; the
          # .vercel.app alias is used because it survives anything that happens
          # to the custom domain's DNS.
          ASSESS_URL: https://everyfield-v2.vercel.app/api/phase-engine/assess
          # Same secret the route checks, and the same one Vercel Cron used to
          # send. It must be set to the IDENTICAL value in both places: this
          # repo's Actions secrets and the Vercel project's production
          # environment. It also opens /api/notifications/dispatch — one secret,
          # two routes (see their source and token checks).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: node scripts/phase-engine-assess.mjs
