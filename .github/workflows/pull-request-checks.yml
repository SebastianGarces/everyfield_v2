name: PR Checks

on:
  # Every pull request, whatever its base — deliberately unfiltered.
  #
  # This was `branches: [main]`, which meant a PR opened against any other
  # base ran no checks at all. That is worse than failing: the PR shows no
  # check rather than a red one, so it reads as "not yet run" indefinitely.
  # PR #34 sat that way for a month against a throwaway base branch.
  #
  # Agents fork from whatever HEAD they are handed, so a wrong base is a
  # realistic mistake. Checking every PR means the mistake surfaces as a
  # diff nobody expected instead of as silence.
  pull_request:

  # On demand, against any ref — the escape hatch for anchoring a sha that is
  # not currently a PR head.
  #
  # `pull_request` alone can only ever anchor the PR's head commit. The loop in
  # ops/agent-os/dod.md assumes "CI re-anchors G1/G2 at the final sha", but a
  # fix round that lands on a side branch (`feature/X-fix`) leaves the PR head
  # behind on `feature/X`, and then no event names the sha under test:
  # `gh run list --commit <sha>` returns `[]` and G1/G2 have no evidence at the
  # commit that would actually ship. #293 hit this three times.
  #
  # Re-pointing the PR head is still the right fix when the sha is meant to
  # ship. This trigger is for proving a sha green *before* moving a ref, and
  # for the case where the verdict is needed at a commit no PR names.
  # Dispatch resolves the workflow file from the default branch, then runs it
  # against the ref you pick, so the run's head_sha is that ref's tip and
  # `gh run list --commit <sha>` finds it.
  workflow_dispatch:

jobs:
  validate:
    # This name is a CONTRACT, not a description. The `main protection` ruleset
    # requires the check by this exact string, so renaming it here without
    # updating the ruleset in the same change silently un-protects `main`:
    # PRs would wait forever on a check name that no longer reports.
    # (It now also runs tests, which the name does not say.)
    name: Format, Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Markdown-only PRs cannot fail anything below: `*.md` is in
      # .prettierignore, tsc and eslint never look at it, and `next build`
      # does not read product-docs. Running the pipeline for them costs ~1m45s
      # to prove nothing.
      #
      # The job still runs and still reports its result — deliberately. The
      # `main protection` ruleset requires this check *by name*, so a
      # `paths-ignore:` trigger would leave a docs PR waiting forever on a
      # check that never arrives. Skipping steps keeps the check reporting;
      # skipping the workflow would silently block the merge.
      #
      # Anything that is not markdown — including .json, .yml, and this
      # workflow itself — takes the full path.
      #
      # This shortcut is defined by a PR's file list, so it only applies to a
      # `pull_request` event. A manual run has no `github.event.pull_request`,
      # and asking for `pulls//files` would 404 the whole job — so a dispatch
      # takes the full path unconditionally. That is also what you want from
      # it: you dispatch this to anchor the suite at a sha, and a run that
      # skipped the suite would anchor nothing.
      - name: Detect docs-only change
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "Manual run at ${{ github.sha }} — running the full pipeline."
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          echo "Changed files:"
          printf '%s\n' "$files"
          non_docs=$(printf '%s\n' "$files" | grep -vE '\.md$' || true)
          if [ -n "$files" ] && [ -z "$non_docs" ]; then
            echo "Markdown only — skipping install, format, lint, typecheck and build."
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup pnpm
        if: steps.scope.outputs.docs_only != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          # 24, matching local dev and Vercel's current default — not 20.
          #
          # This was 20, and adding the Test step is what exposed it: `pnpm
          # test` passes a glob to `node --test`, which only learned to expand
          # globs in Node 22. On 20 it fails with "Could not find
          # 'src/**/*.test.ts'" — so the suite has never been runnable here,
          # and nobody noticed because CI never tried to run it.
          #
          # The deeper fix is the alignment: CI on a different major than dev
          # and production is a divergence that will keep producing failures
          # that reproduce nowhere.
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm format:check

      - name: Lint
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm lint

      - name: Typecheck
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm typecheck

      # The suite is the anchor under DoD gate G2. Before this step, "155/155
      # tests pass" was only ever an agent reporting a number it had produced
      # itself — nothing independent had run it. Verified to pass with no
      # .env.local and an unreachable database, so it needs no real credentials.
      - name: Test
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          RESEND_API_KEY: "re_ci_placeholder"

      - name: Build
        if: steps.scope.outputs.docs_only != 'true'
        run: pnpm build
        env:
          # This build is hermetic: no database, no real credentials. Keep it
          # that way — nothing evaluated at build time (generateStaticParams,
          # sitemap, metadata) may depend on a live query. See issue #38.
          #
          # `next build` collects page data, which evaluates route modules —
          # and several of them construct the Neon client at import time. The
          # client is only constructed here, never connected to, so a
          # syntactically valid placeholder is enough and no real credentials
          # belong in CI. Without this the build fails on the first such route
          # ("No database connection string was provided to `neon()`"), which
          # is why this workflow had never passed since it was added.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          # Same reason: `new Resend(...)` runs at module scope in the email
          # client and the webhook route, and throws on a missing key.
          RESEND_API_KEY: "re_ci_placeholder"

  # ==========================================================================
  # The live database suites — the seam that makes `LIVE_DB_TESTS=1` mean
  # something (#411, quality round 1).
  #
  # WHY A SECOND JOB. The suites that assert the race guards
  # (`fork-and-token-race`, `role-seat-race`, `subtask-parent-fk`,
  # `teams-init-race`, `declaration-race`) skip themselves unless
  # LIVE_DB_TESTS=1 AND `DATABASE_URL` answers `select 1`. The `validate` job
  # above deliberately runs hermetically against an unreachable placeholder, so
  # every one of them skipped on every PR — assertions written, never executed.
  # They cannot simply move into `validate`: that job must stay hermetic (it is
  # what proves the build needs no database), and a race suite needs a real
  # Postgres, three runs deep, which is a slower and differently-shaped job.
  #
  # WHY A NEON PROXY AND NOT PLAIN POSTGRES. `db` is a neon-http client, and
  # neon-http speaks Neon's HTTP protocol — it cannot talk to Postgres over
  # TCP. Swapping in `drizzle-orm/node-postgres` would change what is under
  # test: `db.batch()` exists only on the batching drivers, and every write
  # path here is built on it (`memory/invariants.md` → Transactions). So the
  # driver stays and the ENDPOINT moves: `local-neon-http-proxy` serves Neon's
  # HTTP protocol in front of the Postgres service container, and
  # `localNeonHttpEndpoint` (src/db/connection.ts) points the client at it
  # whenever DATABASE_URL names a local host. Production is untouched — a real
  # Neon host takes the driver's own endpoint.
  #
  # THIS CHECK IS NOT YET REQUIRED BY THE `main protection` ruleset. It runs
  # and reports on every PR; making it blocking is a ruleset edit, which is
  # Sebastian's to make. Its name is therefore not yet a contract — but treat
  # it as one the moment it is added there.
  # ==========================================================================
  live-db-tests:
    name: Live DB Race Suites
    runs-on: ubuntu-latest

    services:
      # pgvector, not plain postgres: migration 0035 creates the `vector`
      # extension, so `pnpm db:migrate` fails on an image without it.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: main
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Neon's HTTP protocol in front of that Postgres. Service containers
      # share a network and reach each other by label, hence `postgres:5432`.
      neon-proxy:
        image: ghcr.io/timowilhelm/local-neon-http-proxy:main
        env:
          PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/main
        ports:
          - 4444:4444

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The proxy authenticates through a MOCK control plane that reads two
      # objects out of the target database. Without them every query comes back
      # as HTTP 500 "Control plane request failed" — which looks like a
      # connection problem and is not.
      - name: Bootstrap the proxy's mock control plane
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d main -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS neon_control_plane;
          CREATE TABLE IF NOT EXISTS neon_control_plane.endpoints (
            endpoint_id VARCHAR(255) PRIMARY KEY,
            allowed_ips VARCHAR(255)
          );
          SQL

      # drizzle-kit connects over plain TCP, so this one takes the direct URL
      # and never the proxy. The guards under test are created HERE — a suite
      # run against an unmigrated database would pass by proving nothing.
      - name: Apply migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/main"

      # `test:live`, not `test`: the full suite also carries CORPUS tests
      # (`templates-live.test.ts`, `article-templates-live.test.ts`) that gate
      # on reachability alone and assert against the 90 published wiki
      # articles. This database is migrated but unseeded, so they would fail
      # here for a reason that has nothing to do with a race. Seeding the
      # corpus is a different job; `src/db/connection.test.ts` §5 keeps the
      # `test:live` list from drifting away from the suites that opt in.
      - name: Run the live suites
        run: LIVE_DB_TESTS=1 pnpm test:live
        env:
          # A local host, so `localNeonHttpEndpoint` routes the neon-http
          # client to the proxy's default endpoint (http://localhost:4444/sql).
          # Set NEON_HTTP_PROXY_URL to override that.
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/main"
          RESEND_API_KEY: "re_ci_placeholder"
