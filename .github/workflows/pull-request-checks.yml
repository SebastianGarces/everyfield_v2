name: PR Checks

on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Format, Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # `next build` collects page data, which evaluates route modules —
          # and several of them construct the Neon client at import time. The
          # client is only constructed here, never connected to, so a
          # syntactically valid placeholder is enough and no real credentials
          # belong in CI. Without this the build fails on the first such route
          # ("No database connection string was provided to `neon()`"), which
          # is why this workflow had never passed since it was added.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
