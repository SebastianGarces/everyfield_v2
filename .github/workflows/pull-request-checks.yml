name: PR Checks

on:
  # Every pull request, whatever its base — deliberately unfiltered.
  #
  # This was `branches: [main]`, which meant a PR opened against any other
  # base ran no checks at all. That is worse than failing: the PR shows no
  # check rather than a red one, so it reads as "not yet run" indefinitely.
  # PR #34 sat that way for a month against a throwaway base branch.
  #
  # Agents fork from whatever HEAD they are handed, so a wrong base is a
  # realistic mistake. Checking every PR means the mistake surfaces as a
  # diff nobody expected instead of as silence.
  pull_request:

jobs:
  validate:
    name: Format, Lint, Typecheck, Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build
        env:
          # This build is hermetic: no database, no real credentials. Keep it
          # that way — nothing evaluated at build time (generateStaticParams,
          # sitemap, metadata) may depend on a live query. See issue #38.
          #
          # `next build` collects page data, which evaluates route modules —
          # and several of them construct the Neon client at import time. The
          # client is only constructed here, never connected to, so a
          # syntactically valid placeholder is enough and no real credentials
          # belong in CI. Without this the build fails on the first such route
          # ("No database connection string was provided to `neon()`"), which
          # is why this workflow had never passed since it was added.
          DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
          # Same reason: `new Resend(...)` runs at module scope in the email
          # client and the webhook route, and throws on a missing key.
          RESEND_API_KEY: "re_ci_placeholder"
