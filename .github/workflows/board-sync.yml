# Mirrors the canonical issue state — `agent:*` / `needs-spec` labels, and closure — onto the
# Project board's Status field.
#
# ONE WAY ONLY. Labels are the source of truth (ops/agent-os/labels.md): build-until-done writes
# them, standup reads them, and agents never read the board. This workflow renders that state for a
# human. Dragging a card in the UI changes nothing durable — the next label event overwrites it.
#
# Done IS mirrored here, from the issue's closed state. The original design assumed GitHub's two
# built-in Project workflows ("item closed" / "PR merged" → Done) would cover it; in practice they
# never fired on this project — 15 closed issues sat in "Pending PR review" until 2026-07-27 —
# most likely because recreating the Status field's options detached them. Rather than depend on
# UI-configured automation nobody can audit from the repo, closure is mirrored by the same
# mechanism as every other status: canonical repo state in, board out. Closure overrides labels,
# so a stray label event on a closed issue re-derives Done instead of dragging the card back.
#
# SETUP (see product-docs/board-design-2026-07.md §9):
#   [x] Project "EveryField Delivery" created — user-owned, number 1
#   [x] Status single-select carries the six options in the case statement below, spelled exactly
#   [x] All open work items backfilled onto the board
#   [x] PROJECT_TOKEN set — a classic PAT, `project` scope ONLY, no expiration. Verified 2026-07-26
#       by round-tripping a label on #73. GITHUB_TOKEN CANNOT write a user-owned Project v2, which
#       is why a PAT exists at all; without the secret this job no-ops.
#
# Setup is COMPLETE. If the board stops updating, the token is the first thing to check
# (github.com/settings/tokens) — but check the Actions tab first, because a broken token fails
# loudly there rather than going quiet.
#
# Absent secret -> exit 0 with a notice, because "not set up yet" is not a failure.
# Present but broken (expired, wrong scope) -> the job FAILS, loudly and visibly in Actions.
# Those are different situations and are deliberately not collapsed into one.
#
# This workflow triggers on `issues` events only, so it never reports as a PR check either way.

name: Board sync

on:
  issues:
    types: [opened, reopened, labeled, unlabeled, closed]

permissions:
  issues: read

concurrency:
  # Serialize per issue so two fast label edits cannot land out of order.
  group: board-sync-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  # Pre-resolved GraphQL node ids. Deliberate: `gh project --owner` needs to look up whether the
  # owner is a user or an org, which a project-scoped token cannot do. Re-resolve only if the
  # project is rebuilt — `gh project view 1 --owner SebastianGarces --format json` for the project
  # id, `gh project field-list 1 --owner SebastianGarces --format json` for the field and options.
  PROJECT_ID: PVT_kwHOAzeefc4BeeCi
  STATUS_FIELD_ID: PVTSSF_lAHOAzeefc4BeeCizhY4Ay4

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror label state onto the board
        env:
          # Two tokens on purpose, so the PAT only ever needs `project` scope:
          #   REPO_TOKEN    — reads labels. GITHUB_TOKEN already has repo scope; a PAT would not.
          #   PROJECT_TOKEN — writes the board. Repo-scoped tokens cannot reach a user-owned project.
          REPO_TOKEN: ${{ github.token }}
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail

          if [ -z "${PROJECT_TOKEN:-}" ]; then
            echo "::notice::PROJECT_TOKEN is not set — board sync skipped. See board-design-2026-07.md §9."
            exit 0
          fi

          # Read live rather than from github.event.issue payload: it is a snapshot, and two quick
          # edits would replay an older state over a newer.
          state_and_labels=$(GH_TOKEN="$REPO_TOKEN" gh issue view "$ISSUE" --repo "$GITHUB_REPOSITORY" --json state,labels --jq '[.state, (.labels[].name)] | join("\n")')
          state=$(echo "$state_and_labels" | head -1)
          labels=$(echo "$state_and_labels" | tail -n +2)

          # Everything below writes the board, so it uses the PAT.
          export GH_TOKEN="$PROJECT_TOKEN"

          # Exactly one of these should ever be present. If more than one is, the board would
          # otherwise silently show whichever we checked last — warn instead of guessing.
          active=$(echo "$labels" | grep -c '^agent:' || true)
          if [ "$active" -gt 1 ]; then
            echo "::warning::Issue #$ISSUE carries $active agent:* labels; ops/agent-os/labels.md requires exactly one. Board not updated."
            exit 0
          fi

          # Option ids, not names. `gh project` resolves --owner by asking whether the owner is a
          # user or an org, and a project-scoped token cannot make that lookup — it fails with
          # "unknown owner type". So this talks to GraphQL directly with pre-resolved ids, which
          # also removes two API round-trips per run. Re-resolve these only if the project is
          # rebuilt: gh project field-list 1 --owner SebastianGarces --format json
          status=""; option_id=""
          case "$labels" in
            *"agent:queued"*)      status="Todo";              option_id="8e532e11" ;;
            *"agent:in-progress"*) status="In Progress";       option_id="2b12f8f4" ;;
            *"agent:in-review"*)   status="Pending PR review"; option_id="a2d0c924" ;;
            # Shares Todo with agent:queued — both are takeable. Applying this label is what
            # puts reviewed work back on the frontier (ops/agent-os/labels.md).
            *"agent:changes-requested"*) status="Todo";        option_id="8e532e11" ;;
            *"agent:blocked"*)     status="Blocked";           option_id="726047a5" ;;
            # Shares the Blocked column with agent:blocked — both mean "a human is needed", and the
            # project has no separate option. The board is derived and coarser; the LABEL is what
            # says whether to fix the code or just retry the delivery (ops/agent-os/labels.md).
            *"agent:delivery-failed"*) status="Blocked";       option_id="726047a5" ;;
            *"needs-spec"*)        status="Backlog";           option_id="a6027ea1" ;;
          esac

          # No mapped label means the issue is not a work item: `feature` parents are indexes,
          # `decision` issues close by a ruling, `deferred` ones are off the roadmap. They stay off
          # the board on purpose — a kanban of things nobody can pick up is noise. Feature grouping
          # is still available via the built-in "Parent issue" field on the children. This applies
          # closed or open, which is why it is checked BEFORE the closed override below.
          if [ -z "$status" ]; then
            echo "No mapped label on #$ISSUE — leaving board untouched."
            exit 0
          fi

          # Closed overrides every label: a closed work item is Done no matter what stale agent:*
          # label it still carries (labels are deliberately not stripped on close — see
          # ops/agent-os/labels.md), and a label event arriving after closure re-derives Done here
          # rather than dragging the card back into an active column.
          if [ "$state" = "CLOSED" ]; then
            status="Done"; option_id="3044f5d2"
          fi

          # The issue's GraphQL node id — a repo read, so it uses the repo token.
          content_id=$(GH_TOKEN="$REPO_TOKEN" gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE" --jq '.node_id')

          # Idempotent: adding an item already on the board returns the existing item.
          item_id=$(gh api graphql -f query='
            mutation($project:ID!, $content:ID!) {
              addProjectV2ItemById(input:{projectId:$project, contentId:$content}) { item { id } }
            }' -F project="$PROJECT_ID" -F content="$content_id" \
            --jq '.data.addProjectV2ItemById.item.id')

          gh api graphql -f query='
            mutation($project:ID!, $item:ID!, $field:ID!, $option:String!) {
              updateProjectV2ItemFieldValue(input:{
                projectId:$project, itemId:$item, fieldId:$field
                value:{singleSelectOptionId:$option}
              }) { projectV2Item { id } }
            }' -F project="$PROJECT_ID" -F item="$item_id" -F field="$STATUS_FIELD_ID" \
               -F option="$option_id" --jq '.data.updateProjectV2ItemFieldValue.projectV2Item.id' > /dev/null

          echo "#$ISSUE → $status"
